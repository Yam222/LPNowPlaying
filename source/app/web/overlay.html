<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LP Now Playing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #ff4e45;
    --accent-soft: rgba(255, 78, 69, .35);
    --scale: 1;
    --disc: 158px;
    --font: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: var(--font); }
  body.preview {
    background:
      radial-gradient(1200px 600px at 20% 10%, #2a2f45 0%, transparent 60%),
      linear-gradient(160deg, #10131c, #1b1f2e 60%, #0d0f16);
  }
  .preview-hint {
    position: fixed; left: 28px; top: 24px; color: rgba(255,255,255,.55); font-size: 13px; line-height: 1.6;
  }
  .preview-hint b { color: #fff; font-weight: 600; }

  /* ── 배치 ───────────────────────────── */
  .stage { position: fixed; padding: 28px; transform-origin: bottom right; transform: scale(var(--scale)); }
  .stage.br { right: 0; bottom: 0; transform-origin: bottom right; }
  .stage.bl { left: 0; bottom: 0; transform-origin: bottom left; }
  .stage.tr { right: 0; top: 0; transform-origin: top right; }
  .stage.tl { left: 0; top: 0; transform-origin: top left; }

  .np {
    position: relative; display: flex; align-items: center; height: calc(var(--disc) + 16px);
    transition: opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .np.hidden { opacity: 0; transform: translateY(14px); pointer-events: none; }

  /* ── 정보 카드 ───────────────────────── */
  .card {
    position: relative; width: 360px; height: 118px; margin-right: calc(var(--disc) * -0.42);
    padding: 16px calc(var(--disc) * 0.42 + 18px) 14px 20px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(22,22,28,.92), rgba(12,12,16,.86));
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
    color: #fff; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(240px 120px at 0% 0%, var(--accent-soft), transparent 70%);
  }
  .eyebrow {
    position: relative; display: flex; align-items: center; gap: 7px;
    font-size: 10px; letter-spacing: .18em; font-weight: 700; color: rgba(255,255,255,.55);
  }
  .src { color: rgba(255,255,255,.38); font-weight: 600; letter-spacing: .14em; }
  .src:not(:empty)::before { content: "·"; margin-right: 7px; }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 10px; }
  .eq i { width: 3px; height: 100%; background: var(--accent); border-radius: 1px; transform-origin: bottom; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.35s; animation-duration: .8s; }
  .eq i:nth-child(3) { animation-delay: -.6s; animation-duration: 1.15s; }
  .paused .eq i { animation-play-state: paused; transform: scaleY(.3); }
  @keyframes eq { 0%,100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }

  .title { position: relative; font-size: 19px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; line-height: 1.3; }
  .title span { display: inline-block; }
  .title.marquee span { animation: marquee var(--marquee-time, 8s) ease-in-out infinite alternate; }
  .title.marquee { mask-image: linear-gradient(90deg, #000 85%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); }
  @keyframes marquee { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--shift, 0px)); } }

  .artist { position: relative; font-size: 13px; color: rgba(255,255,255,.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link {
    position: relative; margin-top: 4px; font-size: 10.5px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: "Cascadia Mono", "Consolas", ui-monospace, monospace; opacity: .95;
  }
  .link svg { width: 11px; height: 11px; vertical-align: -1px; margin-right: 4px; }
  .nolink .link { display: none; }

  .swap .card > .title, .swap .card > .artist, .swap .card > .link { opacity: 0; transform: translateY(6px); }
  .card > .title, .card > .artist, .card > .link { transition: opacity .3s ease, transform .3s ease; }

  /* ── LP 판 ──────────────────────────── */
  .deck { position: relative; width: var(--disc); height: var(--disc); flex: none; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .35s; }
  .swap .deck { transform: translateX(26px) rotate(40deg) scale(.92); opacity: 0; }
  .progress { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); transform: rotate(-90deg); }
  .progress circle { fill: none; stroke-width: 2.5; }
  .progress .track { stroke: rgba(255,255,255,.08); }
  .progress .bar { stroke: var(--accent); stroke-linecap: round; }

  .disc {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle, transparent 0 30%, rgba(0,0,0,.0) 30%),
      repeating-radial-gradient(circle, #0b0b0d 0 1.1px, #19191d 1.1px 2.4px),
      #111;
    box-shadow: 0 14px 34px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04) inset;
    animation: spin 8s linear infinite; /* 프로그램 설정(회전 속도)으로 바뀜 */
    will-change: transform;
  }
  .paused .disc { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .disc::after { /* 바깥 테두리 */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    box-shadow: inset 0 0 0 3px #08080a, inset 0 0 0 4px rgba(255,255,255,.05);
  }
  .ring-text { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ring-text text { fill: rgba(255,255,255,.62); font-size: 8.4px; font-weight: 700; letter-spacing: .5px; font-family: var(--font); }
  .label {
    position: absolute; left: 50%; top: 50%; width: 62%; height: 62%; transform: translate(-50%, -50%);
    border-radius: 50%; background: var(--accent) center / cover no-repeat;
    box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 0 0 5px rgba(255,255,255,.04);
  }
  .hole { position: absolute; left: 50%; top: 50%; width: 7%; height: 7%; transform: translate(-50%, -50%); border-radius: 50%; background: #0d0d10; box-shadow: inset 0 1px 2px rgba(0,0,0,.8), 0 0 0 1.5px rgba(255,255,255,.25); }
  .sheen { /* 회전하지 않는 빛 반사 */
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 20deg, transparent 0 8%, rgba(255,255,255,.09) 13%, transparent 20% 50%, rgba(255,255,255,.06) 63%, transparent 70%);
    -webkit-mask: radial-gradient(circle, transparent 0 31%, #000 31.5%); mask: radial-gradient(circle, transparent 0 31%, #000 31.5%);
  }

  /* 앨범 색이 바뀔 때 부드럽게 */
  .eq i, .label { transition: background-color .8s ease; }
  .link { transition: color .8s ease, opacity .3s ease, transform .3s ease; }
  .progress .bar { transition: stroke .8s ease; }
  .card { transition: background .4s ease, border-color .4s ease, box-shadow .4s ease; }
  .card::before { transition: opacity .4s ease; }

  /* 배경 투명 모드: 카드 배경을 없애고 글자에 그림자를 넣어 어디서든 읽히게 */
  /* 배경 투명도(--bg: 1=기본 카드, 0=투명)와 앨범 색 빛 세기(--glow) */
  .np .card {
    background: linear-gradient(135deg, rgba(22,22,28,calc(.92*var(--bg,1))), rgba(12,12,16,calc(.86*var(--bg,1))));
    border-color: rgba(255,255,255,calc(.08*var(--bg,1)));
    box-shadow: 0 18px 40px rgba(0,0,0,calc(.45*var(--bg,1))), inset 0 1px 0 rgba(255,255,255,calc(.05*var(--bg,1)));
  }
  /* 앨범 색: 카드 전체에 은은하게 + 왼쪽 위에서 퍼지는 빛 + 색 테두리 (앨범 색 강조 슬라이더 = --glow) */
  .np .card::before {
    opacity: var(--bg,1);
    background:
      radial-gradient(360px 180px at 0% 0%, rgba(var(--accent-rgb, 255,78,69), calc(.6*var(--glow,1))), transparent 80%),
      linear-gradient(rgba(var(--accent-rgb, 255,78,69), calc(.16*var(--glow,1))), rgba(var(--accent-rgb, 255,78,69), calc(.16*var(--glow,1))));
  }
  .np .card { border-color: rgba(var(--accent-rgb, 255,78,69), calc(.32*var(--glow,1)*var(--bg,1))) !important; }
  .np .title, .np .artist, .np .link, .np .eyebrow {
    text-shadow: 0 1px 2px rgba(0,0,0,calc(.95*var(--sh,0))), 0 0 6px rgba(0,0,0,calc(.75*var(--sh,0))), 0 0 14px rgba(0,0,0,calc(.45*var(--sh,0)));
  }
  .np.clear .artist { color: rgba(255,255,255,.92); }
  .np.clear .eyebrow { color: rgba(255,255,255,.8); }
  .np.clear .title.marquee { mask-image: none; -webkit-mask-image: none; }

  /* 미리보기 대기 메시지 */
  .waiting { position: fixed; right: 28px; bottom: 28px; color: rgba(255,255,255,.6); font-size: 13px; padding: 12px 16px; border-radius: 12px; background: rgba(0,0,0,.35); border: 1px dashed rgba(255,255,255,.15); }
  .waiting.hide { display: none; }
</style>
</head>
<body>
<div class="preview-hint" id="hint" hidden>
  <b>LP Now Playing 2 미리보기</b><br>
  OBS에는 프로그램 창의 <b>OBS 주소</b>를 브라우저 소스로 추가하세요.
</div>

<div class="stage br" id="stage">
  <div class="np hidden" id="np">
    <div class="card">
      <div class="eyebrow"><span class="eq"><i></i><i></i><i></i></span><span id="state">NOW PLAYING</span><span class="src" id="src"></span></div>
      <div class="title" id="title"><span></span></div>
      <div class="artist" id="artist"></div>
      <div class="link" id="link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg><span></span></div>
    </div>
    <div class="deck">
      <svg class="progress" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="48"/><circle class="bar" id="bar" cx="50" cy="50" r="48"/></svg>
      <div class="disc">
        <svg class="ring-text" viewBox="0 0 200 200">
          <defs><path id="ring" d="M100,100 m-80,0 a80,80 0 1,1 160,0 a80,80 0 1,1 -160,0"/></defs>
          <text><textPath href="#ring" id="ringText" textLength="500" lengthAdjust="spacing"></textPath></text>
        </svg>
        <div class="label" id="label"></div>
        <div class="hole"></div>
      </div>
      <div class="sheen"></div>
    </div>
  </div>
</div>
<div class="waiting hide" id="waiting"></div>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const target = q.get('target') || 'obs';
  const stage = document.getElementById('stage');
  const np = document.getElementById('np');
  const titleEl = document.getElementById('title');
  const artistEl = document.getElementById('artist');
  const linkEl = document.getElementById('link');
  const labelEl = document.getElementById('label');
  const ringEl = document.getElementById('ringText');
  const bar = document.getElementById('bar');
  const stateEl = document.getElementById('state');
  const srcEl = document.getElementById('src');
  const waiting = document.getElementById('waiting');
  const BUILD = '__LP_BUILD__'; // 프로그램이 페이지를 보낼 때 버전으로 바꿔 넣음
  const discEl = document.querySelector('.disc');
  let curSpin = 0;
  const C = 2 * Math.PI * 48;
  bar.style.strokeDasharray = C;
  bar.style.strokeDashoffset = C;

  const pos = (q.get('pos') || 'br').toLowerCase();
  if (['br', 'bl', 'tr', 'tl'].includes(pos)) stage.className = 'stage ' + pos;
  const scale = parseFloat(q.get('scale'));
  if (scale > 0.2 && scale < 5) document.documentElement.style.setProperty('--scale', scale);
  if (target === 'preview') { document.body.classList.add('preview'); document.getElementById('hint').hidden = false; }

  let curKey = null, curSig = '', swapping = false, lastData = null, lastPos = 0, lastPosKey = null;
  const sigOf = d => [d.title, d.artist, d.album, d.artwork, d.linkText].join('\u0001');

  const DEFAULT_ACCENT = '#ff4e45';
  let curAccent = '';
  function applyAccent(hex) {
    const m = /^#([0-9a-f]{6})$/i.exec(hex || '') || /^#([0-9a-f]{6})$/i.exec(DEFAULT_ACCENT);
    const v = m[1];
    if (v === curAccent) return;
    curAccent = v;
    const rgb = [0, 2, 4].map((i) => parseInt(v.slice(i, i + 2), 16)).join(', ');
    document.documentElement.style.setProperty('--accent', `rgb(${rgb})`);
    document.documentElement.style.setProperty('--accent-rgb', rgb);
    document.documentElement.style.setProperty('--accent-soft', `rgba(${rgb}, .5)`);
  }

  function fitMarquee() {
    const span = titleEl.firstElementChild;
    titleEl.classList.remove('marquee');
    const over = span.scrollWidth - titleEl.clientWidth;
    if (over > 4) {
      titleEl.style.setProperty('--shift', (-over - 16) + 'px');
      titleEl.style.setProperty('--marquee-time', Math.max(5, over / 22) + 's');
      void titleEl.offsetWidth;
      titleEl.classList.add('marquee');
    }
  }

  function ringText(t, a) {
    let base = [t, a].filter(Boolean).join('  •  ').toUpperCase();
    if (!base) base = 'NOW PLAYING';
    if (base.length > 62) base = base.slice(0, 60) + '…';
    let s = base + '  •  ';
    while (s.length < 46) s += base + '  •  ';
    return s;
  }

  function applyTrack(d) {
    titleEl.firstElementChild.textContent = d.title;
    artistEl.textContent = [d.artist, d.album].filter(Boolean).join(' · ');
    linkEl.lastElementChild.textContent = d.linkText || '';
    labelEl.style.backgroundImage = d.artwork ? `url("${d.artwork.replace(/"/g, '%22')}")` : 'none';
    ringEl.textContent = ringText(d.title, d.artist);
    requestAnimationFrame(fitMarquee);
  }

  function show(on, msg) {
    np.classList.toggle('hidden', !on);
    if (target === 'preview') {
      waiting.textContent = msg || '';
      waiting.classList.toggle('hide', on || !msg);
    }
  }

  function render(d) {
    // 프로그램이 업데이트되면(버전이 바뀌면) 새 화면으로 자동 새로고침 (OBS 캐시 문제 방지)
    if (d.build && BUILD.indexOf('__') !== 0 && d.build !== BUILD) { location.reload(); return; }
    if (d.spinSeconds > 0 && d.spinSeconds !== curSpin) {
      curSpin = d.spinSeconds;
      discEl.style.animationDuration = curSpin + 's';
    }
    if (!d.running) return show(false, '프로그램이 중지 상태예요. 창에서 [시작]을 눌러 주세요.');
    if (!d.enabled) return show(false, '이 출력은 꺼져 있어요.');
    if (!d.connected) return show(false, '확장 프로그램 연결 대기 중… YouTube나 YouTube Music 탭을 열어 주세요.');
    if (!d.hasTrack) return show(false, d.isAd ? '광고 재생 중이라 잠시 숨겼어요.' : 'YouTube나 YouTube Music에서 음악을 재생해 주세요.');

    np.classList.toggle('paused', !d.playing);
    np.classList.toggle('clear', !!d.transparent);
    const bg = typeof d.bgAlpha === 'number' ? d.bgAlpha : 1;
    np.style.setProperty('--bg', bg);
    np.style.setProperty('--sh', (1 - bg).toFixed(2));
    np.style.setProperty('--glow', typeof d.glow === 'number' ? d.glow : 1);
    applyAccent(d.accent);
    np.classList.toggle('nolink', !d.showLink || !d.linkText);
    const st = d.playing ? 'NOW PLAYING' : 'PAUSED';
    if (stateEl.textContent !== st) stateEl.textContent = st; // 바뀔 때만 (불필요한 레이아웃 방지)
    const src = d.source === 'youtube' ? 'YOUTUBE' : 'YOUTUBE MUSIC';
    if (srcEl.textContent !== src) srcEl.textContent = src;
    let pos = d.position;
    // 재생 중에 1.5초 이내로 뒤로 가는 값은 무시 (흔들림 방지)
    if (d.playing && d.key === lastPosKey && pos < lastPos && lastPos - pos < 1.5) pos = lastPos;
    lastPos = pos; lastPosKey = d.key;
    const p = d.duration > 0 ? Math.min(1, pos / d.duration) : 0;
    if (d.key !== curKey) {
      bar.style.strokeDashoffset = C; // 곡이 바뀌면 진행바 처음부터
    }
    const off = (C * (1 - p)).toFixed(1);
    if (bar.style.strokeDashoffset !== off + 'px' && bar.style.strokeDashoffset !== off) bar.style.strokeDashoffset = off;

    if (!swapping) {
      const sig = sigOf(d);
      if (d.key !== curKey) {
        const first = curKey === null || np.classList.contains('hidden');
        curKey = d.key; curSig = sig;
        if (first) { applyTrack(d); }
        else {
          swapping = true;
          np.classList.add('swap');
          setTimeout(() => { const L = lastData || d; applyTrack(L); curKey = L.key; curSig = sigOf(L); np.classList.remove('swap'); swapping = false; }, 380);
        }
      } else if (sig !== curSig) {
        // 같은 곡인데 정보가 늦게 갱신된 경우: 애니메이션 없이 바로 반영
        curSig = sig; applyTrack(d);
      }
    }
    lastData = d;
    show(true);
  }

  async function poll() {
    try {
      const r = await fetch('/api/now?target=' + encodeURIComponent(target) + '&v=' + encodeURIComponent(BUILD), { cache: 'no-store' });
      render(await r.json());
    } catch {
      show(false, '프로그램에 연결할 수 없어요.');
    }
    setTimeout(poll, 700);
  }
  poll();
  window.addEventListener('resize', () => requestAnimationFrame(fitMarquee));
})();
</script>
</body>
</html>
